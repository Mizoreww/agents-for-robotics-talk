<script id="deckData" type="application/json">{"slides": [{"number": 1, "title": "Agents for Robotics", "section": "", "ids": [], "notes": "TIME: 0.5 minutes\n\nThis is a focused technical talk about general-purpose agents in robotics. We will study only three works in depth: Claude Plays Robotics, Agentic Real2Sim, and ENPIRE. They address three different questions: what a general model can execute, what kind of world it can construct, and how it can organize experiments that improve a robot. Original application videos will interrupt the technical sections. Treat those clips as examples of possibility, while the case studies tell us what has actually been measured. The talk follows a goal, a problem, a mechanism, evidence and limitations, rather than a catalog of papers. All source links and the detailed qualifications are in these notes.\n\nSOURCES\n\n", "minutes": 0.5}, {"number": 2, "title": "Demo: A Robot Paints with Feedback", "section": "", "ids": ["S11"], "notes": "TIME: 2.5 minutes\n\nPlay the original painting clip, which lasts roughly a minute. The robot motion is compelling because the agent must connect a visual goal to a sequence of physical marks, inspect what happened, and revise the plan. Ask the audience what they think is being learned. The original author describes initial anchor points, calibration, roughly one minute of action planning, and human feedback across iterations and sometimes during execution. The agent changes instructions and calibration. This does not establish that the model weights update online. Nor can the pace of an edited social video tell us the true inference latency. The point of the clip is to expose the useful workflow: observe, propose, execute, inspect and revise. It also introduces the talk’s central question. Which parts of that workflow are reusable robot capability, and which parts still depend on the particular setup and human support? Keep the distinction open until the case studies. The clip is muted for a narrated presentation and has no additional speedup applied by this deck.\n\nSOURCES\nS11: @cdngdev, X demo and method thread (8 Sep 2026)\nhttps://x.com/cdngdev/status/2097339677128982873\n", "minutes": 2.5}, {"number": 3, "title": "Our Ultimate Goal", "section": "", "ids": [], "notes": "TIME: 2.5 minutes\n\nStart from the desired capability. A person should be able to state an intent, and the robot should finish the job despite uncertainty in geometry, contact or task progress. The stronger goal is that useful experience persists so a later job requires less search and less human intervention. These two time scales are different. Within-task feedback may rescue the current attempt without changing what the system knows next time. Across-task improvement requires a concrete artifact that survives the session, such as a program, skill library or trained policy. The diagram is our synthesis, not a published architecture and not a claim that one surveyed system solves the full problem. The return arrow means that retained capability can support a future execution. It does not mean the general model necessarily updates its weights. Use this distinction throughout the talk: what changes during the run, what persists afterward, and what independent test would demonstrate that the change is useful? We will look at execution first, then world construction, then real experimental improvement.\n\nSOURCES\n\n", "minutes": 2.5}, {"number": 4, "title": "Three Questions, Three Case Studies", "section": "", "ids": [], "notes": "TIME: 1 minutes\n\nThe three case studies are selected because each sharpens a different question. Claude Plays Robotics controls the interface and tests where a general model succeeds or fails. Agentic Real2Sim standardizes a complex conversion pipeline and evaluates all attempted episodes, including failures. ENPIRE puts real robot rollouts inside an improvement workflow. The demonstration interludes broaden the application picture without adding more full paper sections. These are not mandatory stages of one pipeline: ENPIRE can improve directly on hardware without first building a simulator. Do not compare their success percentages as a leaderboard. They measure different units: completing a control task, accepting a replay, and solving a task under a real experimental protocol.\n\nSOURCES\n\n", "minutes": 1}, {"number": 5, "title": "Claude Plays Robotics", "section": "1", "ids": ["S09"], "notes": "TIME: 3 minutes\n\nThis report is useful as a capability assessment rather than just another successful robot demonstration. Read the original figure by interface. The model may output actions directly, synthesize a controller in code, or reason above a more capable execution scaffold. Those settings assign different amounts of perception, geometry, stabilization and motor control to the language model. Scores across those columns cannot be treated as interchangeable task-success rates. First explain what each interface permits, then ask why performance differs. Code can contain a fast feedback controller even if the model that wrote it is slow. A VLA can execute a grounded skill while a supervisor decides when to change the instruction. These are meaningful ways to use general reasoning, but they do not show that the model itself has acquired every lower-level capability. The report uses multiple models, task families and protocols. The original chart preserves that context. Our focus is the experimental lesson: control the interface before attributing progress to model intelligence. No Claude service was invoked to produce this talk; the slide uses the publicly published report and figure.\n\nSOURCES\nS09: Anthropic, Claude Plays Robotics (9 Jul 2026)\nhttps://www.anthropic.com/research/claude-plays-robotics\n", "minutes": 3}, {"number": 6, "title": "Direct Control Meets Physical Constraints", "section": "1", "ids": ["S09"], "notes": "TIME: 3.5 minutes\n\nPlay the two original animations and distinguish their roles. The humanoid animation compares a generated Python controller against zero commands. It illustrates the value of an executable controller, not high-frequency reasoning by the language model. The manipulation clip is a qualitative example and must not be read as the typical success rate. In the report’s direct manipulation setting, complete task success remains around zero to 5.5 percent. The report also separates successful intermediate subgoals from complete task success. Ask why touching or grasping an object might be easier than finishing the entire task. Precision, contact, coordinate grounding and timing all matter. For locomotion, some experiments pause simulation during model calls. The report discusses roughly 83 Hz control requirements and about 0.2 to 0.4 Hz model calls, which are different time scales. A result in paused simulation is not evidence of real-time physical control. A sensible response is to delegate fast control to a suitable controller or policy, and give the general model a slower, well-defined role. The next slide tests whether that supervisory role always helps.\n\nSOURCES\nS09: Anthropic, Claude Plays Robotics (9 Jul 2026)\nhttps://www.anthropic.com/research/claude-plays-robotics\n", "minutes": 3.5}, {"number": 7, "title": "A Supervisor Can Disrupt a Capable VLA", "section": "1", "ids": ["S09"], "notes": "TIME: 3 minutes\n\nThis figure reports familiar LIBERO-40 tasks. Read it from the perspective of the base VLA. On tasks the VLA already knows, an added supervisor can introduce an unnecessary instruction change, an incorrect progress judgment, or an interruption to a policy that would otherwise succeed. Elsewhere in the same report, novel-task results show that a supervisor can help by decomposing the goal or choosing useful instructions. That separate result is not plotted here. The important result is that supervision is not uniformly beneficial. Separate rescue of failed cases from damage to already successful cases. The small diagram below is our simplified interface interpretation rather than a reproduction of the report’s exact implementation. It shows the model choosing at a slower task level while a policy handles execution. A good comparison holds the low-level policy fixed and measures task completion, intervention frequency, latency, and harmful interventions. The report’s LIBERO-40 setting has 40 tasks and five seeds, giving 200 trials, but it is not comparable to the small real-robot assessment in the next slide. Close the case study with a bounded conclusion: general reasoning can be useful when its interface and time scale match the job.\n\nSOURCES\nS09: Anthropic, Claude Plays Robotics (9 Jul 2026)\nhttps://www.anthropic.com/research/claude-plays-robotics\n", "minutes": 3}, {"number": 8, "title": "Demo: Placement and Fine Insertion", "section": "", "ids": ["S10"], "notes": "TIME: 3 minutes\n\nPlay the placement and insertion clips sequentially. Robocurve is an independent evaluator; its domain is not an official OpenAI robotics report. The evaluated system receives three camera views and proprioceptive state. It calls move_to with absolute end-effector poses, while inverse kinematics handles joints. Trials use a 20-model-call budget, medium reasoning, a 25 percent speed cap, and safety limits. The observed Astra completion count is 19 out of 20 for bowl placement and two out of 20 for insertion. The Fable 5.1 comparison is eight out of 20 for placement and two out of 20 for insertion. This small assessment suggests that coarse placement and fine contact remain quite different challenges. It does not isolate all causes of the gap. The comparison includes different placement rigs, non-interleaved runs, manual reset, and unblinded scoring. Do not merge these denominators with the previous LIBERO results. The insertion clip is a published failed run. Its value is to keep failure visible beside an impressive success. The apparent clip speed does not establish end-to-end model latency.\n\nSOURCES\nS10: Robocurve, GPT-6 Astra on robotic manipulation (4 Sep 2026)\nhttps://openai.robocurve.org/gpt-6-astra/\n", "minutes": 3}, {"number": 9, "title": "Demo: Wiping a Table", "section": "", "ids": ["S23"], "notes": "TIME: 2 minutes\n\nThis is an application interlude, not a fourth benchmark study. Play the original wiping demonstration. Compared with one discrete pick-and-place command, wiping highlights sustained interaction with a surface. Ask the audience which quantities would need to be controlled: tool pose, contact, coverage and progress. The post demonstrates a behavior, but the available public description does not establish a complete interface specification, force-control measurements, or repeated evaluation. We should not infer those details from the animation or from the author’s commentary about general intelligence. A visible chain of thought is also not a causal measurement of the controller. The useful question is whether a flexible agent can coordinate a practical task through the tools it has, and what experimental evidence would make that claim reliable. Keep the excitement of the demo, but do not attach an unsupported success rate or autonomy label.\n\nSOURCES\nS23: @k7agar, X wiping demo (6 Sep 2026)\nhttps://x.com/k7agar/status/2096593654320341027\n", "minutes": 2}, {"number": 10, "title": "Agentic Real2Sim: A Real Episode and Its Twin", "section": "2", "ids": ["S13"], "notes": "TIME: 3 minutes\n\nPlay the real and simulated episode as a pair. The project provides both videos for the same recorded episode. Their role here is illustrative; this presentation does not perform a synchronized numerical error analysis. The case study converts an interaction episode, not just a static mesh. It must recover actors, objects, camera geometry, poses, trajectories, and contact relationships sufficiently well to run a simulator. This is a significant engineering problem because the visual scene does not uniquely determine the physics. A wrong collision shape, friction coefficient, or camera pose can partly compensate for another error on one observed trajectory. Ask what happens if we move faster, contact the object elsewhere, or start from a new pose. That counterfactual question separates a replay from a predictive world. The paper’s main evaluation concerns replay acceptance. We will first understand how the agent organizes the conversion, then inspect the exact acceptance protocol, and finally use an author-disclosed social demo failure to make the boundary concrete.\n\nSOURCES\nS13: Agentic Real2Sim, arXiv:2607.19190v3 (24 Jul 2026)\nhttps://arxiv.org/html/2607.19190v3\n", "minutes": 3}, {"number": 11, "title": "Agentic Real2Sim: The Conversion Pipeline", "section": "2", "ids": ["S13"], "notes": "TIME: 4 minutes\n\nFollow the original architecture figure from the recorded input to a runnable scene. The visual stage extracts objects, segmentation, depth and poses. A physical-prior stage supplies structured hypotheses about object properties. Scene preparation assembles actors, geometry, cameras and trajectories. Simulator-in-the-loop refinement then runs the episode, compares the outcome and updates the construction. The agent is not producing every geometric estimate directly. SAM3, SAM3D, FoundationStereo, FoundationPose and deterministic optimization or search do specialized work. The key contribution is a constrained, inspectable workflow that coordinates those components. Identify which intermediate artifacts each stage passes to the next. Then consider how an early segmentation or pose error can propagate into a later physics mismatch. This is why replacing the language-model backend alone may not fix the entire pipeline. The figure establishes an architecture, not proof that every output has correct dynamics. A useful ablation would hold the episode and downstream tools fixed while changing one uncertain component. The paper provides an episode-level comparison; the following slide shows what that comparison actually counts.\n\nSOURCES\nS13: Agentic Real2Sim, arXiv:2607.19190v3 (24 Jul 2026)\nhttps://arxiv.org/html/2607.19190v3\n", "minutes": 4}, {"number": 12, "title": "Replay Acceptance on DROID-100", "section": "2", "ids": ["S13"], "notes": "TIME: 3 minutes\n\nRead the entire left plot, including failures. The best reported backend, Gemma 4 31B, has 48 accepted replays, eight partial results and 44 failures out of all 100 attempted DROID episodes. Other backends have success counts between 37 and 45. Explain the acceptance rule before interpreting the bars. The pipeline filters candidates using grasp, video and motion statistics, retains at most five, and asks three VLM judges to score them. Each judge chooses its best candidate. A replay succeeds if any judge’s best score is at least eight out of ten. This is not majority voting, not agreement among all judges, and not an average score threshold. The criteria concern target identity, final location, action similarity and end-effector position. They do not directly measure identified physical parameters or predictions under new actions. The right plot has a logarithmic cost axis. Reported dollar costs count model calls only, not the whole perception pipeline, simulator compute or human preparation. The result is useful because it includes a full denominator and shows where conversion still fails. The next scientific step is held-out intervention or downstream policy utility, not simply a more attractive replay.\n\nSOURCES\nS13: Agentic Real2Sim, arXiv:2607.19190v3 (24 Jul 2026)\nhttps://arxiv.org/html/2607.19190v3\n", "minutes": 3}, {"number": 13, "title": "Demo: Real2Sim and a Disclosed Failure", "section": "", "ids": ["S12"], "notes": "TIME: 3 minutes\n\nThese videos are original author demonstrations, separate from the Agentic Real2Sim paper and its evaluation. The thread describes an agent coordinating multi-view RGB, known robot actions, camera calibration, asset creation, MuJoCo execution and Blender rendering. This is an interesting example of a general coding agent coordinating a long robotics toolchain. The microphone example is especially informative because the author explicitly discloses that the dynamics failed. The displayed result is a kinematic replay. A rigid proxy could not express the compliant snap-fit behavior required by the task. Do not present that clip as a successful recovery of physical dynamics. Instead, use it to explain a model-class limitation: more parameter search cannot necessarily repair a simulator representation that lacks the required contact behavior. This is a synthesis motivated by the disclosed failure, not a claim that all Real2Sim approaches fail. The supplied microphone excerpt is the 35-to-60-second portion of the original, with no additional speedup. A compelling rendering and a useful engineering workflow can coexist with an unresolved predictive model.\n\nSOURCES\nS12: @Lingxiao234, X Real2Sim and failure thread (8 Sep 2026)\nhttps://x.com/Lingxiao234/status/2096992059731443923\n", "minutes": 3}, {"number": 14, "title": "ENPIRE: Real Experiments Inside the Loop", "section": "3", "ids": ["S15"], "notes": "TIME: 3 minutes\n\nPlay the 300-to-330-second excerpt of the original pin-insertion task video. This excerpt illustrates the hardware interaction and is not a complete rollout. ENPIRE stands for a workflow that includes the environment, policy improvement, rollout and experiment analysis. It is the work intended by the earlier reference to EMPIRE in this robotics-autoresearch context. The central shift is that a coding agent can propose a policy change, run a real robot experiment, inspect the resulting logs and observations, and choose a next change. The artifact may be a heuristic program, a policy or a training recipe. The general language model does not have to change its own weights. Nor should a successful video be confused with the full experimental result. We need to know who established safety, how the robot resets, how success is detected, what the agent may modify, and how retries count. The next three slides examine exactly those components. Compared with a one-off demonstration, the important opportunity is repeatability: a robot experiment that can run again and return a signal useful for the next decision. The environment infrastructure is therefore part of the method, not a footnote.\n\nSOURCES\nS15: ENPIRE, arXiv:2606.19980v1 (Jun 2026)\nhttps://arxiv.org/html/2606.19980v1\n", "minutes": 3}, {"number": 15, "title": "ENPIRE: Environment and Improvement", "section": "3", "ids": ["S15"], "notes": "TIME: 4.5 minutes\n\nWalk through the method panel of the original framework. The crop removes the separate timeline and task-photo rows while retaining the human, environment, tools, and policy-improvement loop. First the agent constructs an environment with human feedback. This phase includes the control tools, hard safety constraints, automatic reset, and success verification. After those components are established, the environment API is fixed for the autonomous improvement phase. Policy improvement proposes and implements a change. Real rollout executes it. Experiment analysis uses observations, logs and outcomes to diagnose failures and decide the next change. ENPIRE supports different policy mechanisms, including heuristic code, behavior cloning, online or offline reinforcement learning, and VLA combinations. Do not collapse those choices into a single model that learns everything. The separation between environment and policy is important because it gives the improvement process a stable contract. If the agent could quietly change the success test whenever its policy failed, apparent progress would become hard to interpret. Ask the audience where their current manual robotics workflow spends the most effort: proposing changes, running trials, resetting hardware, or deciding what the failure means. ENPIRE’s contribution is an executable workflow around those activities. Its limits include the initial engineering, the quality of feedback and the scope of tasks tested.\n\nSOURCES\nS15: ENPIRE, arXiv:2606.19980v1 (Jun 2026)\nhttps://arxiv.org/html/2606.19980v1\n", "minutes": 4.5}, {"number": 16, "title": "ENPIRE: Reset and Verification", "section": "3", "ids": ["S15"], "notes": "TIME: 3 minutes\n\nPlay the reset example and then the verification clip. These are two different tasks, selected to expose the experimental infrastructure rather than to imply a synchronized pipeline. The pin reset makes another trial possible without a person manually restoring every object. The zip-tie verifier uses image cropping and segmentation to determine whether the strap passes through the head. The paper considers two camera views to reduce false positives. Other task verifiers can combine vision with proprioception or torque. This is part of the real scientific bottleneck: the agent only improves against the feedback it receives. A false positive rewards the wrong behavior; an unreliable reset changes the experimental distribution. Some reset procedures start at the hardest task phase rather than at an arbitrary full-task initial state, and the setup phase uses human assistance. Those choices are legitimate when explicitly reported. They change what success means and where the method can be transferred. Ask what independent audit would catch a verifier exploiting a visual shortcut. Keep hard safety constraints, reset correctness, and evaluation correctness conceptually separate. Passing one does not prove the other two.\n\nSOURCES\nS15: ENPIRE, arXiv:2606.19980v1 (Jun 2026)\nhttps://arxiv.org/html/2606.19980v1\n", "minutes": 3}, {"number": 17, "title": "ENPIRE: Improvement on Pin Insertion", "section": "3", "ids": ["S15"], "notes": "TIME: 3.5 minutes\n\nThis is the pin-insertion panel of the original Figure 3. The crop removes the Push-T row but keeps the pin axes, legends and example photograph. The left curves compare coding-agent backends as research time increases. The middle curves compare team size, showing how multiple workers can reach a useful result sooner. Read research time as wall-clock experimental development time, not policy inference latency. The task protocol matters just as much as the curve. ENPIRE allows up to eight conditional retries in a rollout. A later attempt can use information from an earlier failure. Therefore a final success figure near 99 percent is not one-shot insertion precision and is not an independent best-of-eight experiment. We cannot invert it using an independent Bernoulli formula to infer a per-attempt success probability. Recovery is a real capability and deserves credit, but it must remain visible. Some resets also begin at a hard subphase. The correct claim is that the workflow improves policies under the stated environment, reset and retry protocol. It does not establish unrestricted autonomy from arbitrary initial conditions. The next slide separates faster discovery from resource efficiency.\n\nSOURCES\nS15: ENPIRE, arXiv:2606.19980v1 (Jun 2026)\nhttps://arxiv.org/html/2606.19980v1\n", "minutes": 3.5}, {"number": 18, "title": "More Robots Shorten Time, but Raise Cost", "section": "3", "ids": ["S15"], "notes": "TIME: 2.5 minutes\n\nThe original figure separates three outcomes of scaling from one to four to eight agents or robot workers. More resources can reduce wall-clock time to a successful result. At the same time, token consumption increases, GPU utilization can rise, and per-robot utilization can fall. The middle panel contrasts observed mean token utilization with a simple linear projection; keep that distinction visible. The right panel puts token cost and time on separate axes. Do not call the system more efficient merely because the line for time falls. Depending on the deployment objective, lower time-to-result may be worth substantially higher total compute, but it remains a tradeoff. This closes the ENPIRE case study: the workflow is a concrete advance in organizing real experiments, yet reliable resets, trustworthy feedback, human preparation and total cost remain central. A stronger future result would show that the retained policy transfers and lowers the cost of solving new tasks, under an independent evaluator. Process activity or a busy robot fleet alone is not evidence of better capability.\n\nSOURCES\nS15: ENPIRE, arXiv:2606.19980v1 (Jun 2026)\nhttps://arxiv.org/html/2606.19980v1\n", "minutes": 2.5}, {"number": 19, "title": "Demo: Designing a Tendon-Driven Hand", "section": "", "ids": ["S24"], "notes": "TIME: 2 minutes\n\nThis is a different kind of robotics application: design and visualization rather than robot execution. Play the author’s CAD animation. The thread reports roughly 48 hours of work, build123d-generated STEP geometry, JavaScript animation and GLB visualization. The visual complexity is impressive, but the author explicitly states that the current design cannot directly work in reality. It has not established a manufactured hand, validated tendon dynamics or reliable mechanical operation. We should therefore describe the output as a design artifact that a general agent helped create. Ask what the next engineering test should be: tendon routing clearance, friction, actuator sizing, tolerances, or a physical prototype. The point is that agents now contribute to more of the robotics workflow than high-level task planning. The evidence standard depends on the artifact: a geometric rendering is useful, but it supports a different claim from a working mechanism on a bench. Keep the demonstration and the author’s limitation together.\n\nSOURCES\nS24: @earthtojake, X hand design and limitation thread (10 Sep 2026)\nhttps://x.com/earthtojake/status/2097789988670709821\nhttps://x.com/earthtojake/status/2097789991426335015\nhttps://x.com/earthtojake/status/2097801101890207893", "minutes": 2}, {"number": 20, "title": "Demo: Inspecting and Repairing an Execution", "section": "", "ids": ["S17"], "notes": "TIME: 2 minutes\n\nThis brief project demonstration broadens the picture of what an agent can retain. ASPIRE records multimodal execution traces, localizes failures, repairs code, and accumulates reusable skills. Play the trace inspection excerpt and point out the connection between a visual observation and the program being repaired. We do not add another full paper analysis or another headline success percentage here. The conceptual distinction is the update target. A repaired skill library is external memory and executable code, not necessarily a change to the foundation model’s weights. A meaningful claim of accumulation would require showing that retained skills help later tasks and survive beyond the debugging session. The original paper evaluates particular task and transfer splits, so this clip alone cannot establish open-world continual learning. Use it as the bridge into the synthesis: across action, world construction and experimental improvement, what exactly is the agent allowed to change, what evidence comes back, and what useful artifact remains?\n\nSOURCES\nS17: ASPIRE, arXiv:2607.00272v1 (Jun 2026)\nhttps://arxiv.org/html/2607.00272v1\n", "minutes": 2}, {"number": 21, "title": "Our Synthesis: What the Agent Can Change", "section": "", "ids": [], "notes": "TIME: 4 minutes\n\nThis diagram is our synthesis and deliberately simplifies each route. Read each row separately. For execution, the agent changes a decision that a controller can execute, and robot observations inform the next decision. For world building, the agent and its tools change a scene or model, run a simulator, and use mismatch as feedback. For improvement, the agent changes a policy or training procedure, runs a real experiment, and uses a verifier’s outcome to choose a next change. The return arrows represent the corresponding feedback loops. They do not imply that all three systems share one implementation, use the same objective, or update the language model’s weights. The leftmost inputs remain distinct. ENPIRE does not require a reconstructed world before it can operate. Across all three rows, an impressive outcome becomes scientifically useful only when we can name the editable object, the feedback signal, the retained artifact, and the evaluation distribution. The next experiment should test whether the output works beyond the condition used to construct it: a new contact state, a held-out action, or a new task.\n\nSOURCES\n\n", "minutes": 4}, {"number": 22, "title": "Conclusion", "section": "", "ids": [], "notes": "TIME: 1.5 minutes\n\nClose by returning to the opening painting demo. General agents can already coordinate useful pieces of robotics: choosing actions, building simulator scenes, designing mechanisms, inspecting traces and running real experiments. The three case studies make the boundaries clearer. Claude Plays Robotics shows that the interface and control time scale determine what the model must solve. Agentic Real2Sim shows a standardized conversion pipeline with a complete replay denominator, while leaving counterfactual prediction to separate tests. ENPIRE shows that real hardware can sit inside an iterative improvement workflow, provided reset, safety and verification are in place. The social demonstrations broaden the application space but do not replace those tests. The practical question to take away is simple: what capability remains after this run, and how would we know it makes the next task easier? Invite discussion on one concrete proposed test, rather than on whether an exciting video should be labeled general intelligence.\n\nSOURCES\n\n", "minutes": 1.5}], "media": [{"slide": 2, "alt": "VIDEO:painting", "file": "media/painting.mp4", "sourceUrl": "https://x.com/cdngdev/status/2097339677128982873", "x": 74, "y": 165.25, "w": 792, "h": 445.5, "name": "painting", "start_seconds": 0, "duration_seconds": 68.116667, "speed_multiplier": 1, "audio": "removed for narrated talk", "poster": "posters/painting.jpg <script>
'use strict';
const deck=JSON.parse(document.getElementById('deckData').textContent);
const el=id=>document.getElementById(id);let current=1;
for(const s of deck.slides){const o=document.createElement('option');o.value=s.number;o.textContent=s.number+' / '+deck.slides.length+' — '+s.title;el('slideSelect').append(o)}
const activeVideos=()=>[...document.querySelectorAll('video')];
function pause(){for(const v of activeVideos())v.pause()}
function show(n){pause();current=Math.max(1,Math.min(deck.slides.length,Number(n)));const slide=deck.slides[current-1];el('slideSelect').value=String(current);el('slideImage').src='slides/'+String(current).padStart(2,'0')+'.png';el('slideImage').alt='Slide '+current+': '+slide.title;el('videos').replaceChildren();
 const clips=deck.media.filter(m=>m.slide===current);for(const m of clips){const v=document.createElement('video');v.src=m.file;v.poster=m.poster;v.controls=true;v.playsInline=true;v.preload='metadata';v.muted=true;v.setAttribute('aria-label',m.name+' video');v.dataset.clip=m.name;v.style.cssText='left:'+m.x/12.8+'%;top:'+m.y/7.2+'%;width:'+m.w/12.8+'%;height:'+m.h/7.2+'%;';v.addEventListener('error',()=>{el('message').textContent='Video could not load: '+m.name+'. Keep the media folder beside this file.'});el('videos').append(v)}
 el('notes').textContent='SLIDE '+current+' · '+slide.title+'\n\n'+slide.notes;el('message').textContent=clips.length?clips.length+' offline video'+(clips.length>1?'s':'')+' on this slide.':'No video on this slide.';
 for(const id of ['play','pause','restart'])el(id).disabled=!clips.length;el('prev').disabled=current===1;el('next').disabled=current===deck.slides.length;history.replaceState(null,'','#slide-'+current);
}
el('prev').onclick=()=>show(current-1);el('next').onclick=()=>show(current+1);el('slideSelect').onchange=e=>show(e.target.value);
el('play').onclick=async()=>{try{await Promise.all(activeVideos().map(v=>v.play()));el('message').textContent='Playing '+activeVideos().length+' video'+(activeVideos().length>1?'s':'')+'.'}catch(e){el('message').textContent='Please use the play control on each video.'}};
el('pause').onclick=()=>{pause();el('message').textContent='Videos paused.'};el('restart').onclick=()=>{pause();for(const v of activeVideos())v.currentTime=0;el('message').textContent='Videos reset to the beginning.'};
el('notesButton').onclick=()=>{el('notes').hidden=!el('notes').hidden;el('notesButton').textContent=el('notes').hidden?'Show notes':'Hide notes';if(!el('notes').hidden)el('notes').scrollIntoView({behavior:'smooth',block:'start'})};
el('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});
const initial=location.hash.match(/^#slide-(\d+)$/);show(initial?Number(initial[1]):1);
</script></body></html>
